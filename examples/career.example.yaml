# ---- SELF-ASSESSMENT. The person's own view. Never printed as fact. ----
self_assessment:
  strengths:
    - claim: "Getting finance and engineering to agree on what a number means before building anything."
      backed_by: [exp-northwind-2021]
      confidence: high
      source: "user-ramble 2026-08-15"
    - claim: "Taking over systems nobody wants to own and making them boring."
      backed_by: [exp-northwind-2021, exp-fernhill-2018]
      confidence: high
      source: "user-interview 2026-08-16"
  people_come_to_me_for:
    - "Untangling a pipeline that fails in a different way every week."
    - "Writing the runbook when there isn't one."
  working_on:
    - claim: "Kubernetes. Can read a manifest, cannot design a cluster."
      source: "user-interview 2026-08-16"
    - claim: "Saying no to work that lands on me because I am the one who will do it."
      source: "user-ramble 2026-08-15"
  prefers:
    - "Small teams, high autonomy, a system that is already on fire."
    - "Written decisions over standups."

meta:
