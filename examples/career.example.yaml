# Example career.yaml (schema v2). Fictional data, for demoing/testing resume-kit.
# Copy the shape, not the content, into your own private data directory.
#
# The source paths below are what a real record looks like after a few runs:
# documented claims cite an archived file under 01_intake/output/processed/,
# and anything the person said in an interview or ramble cites the session.
# In a real workspace those files exist; here they are illustrative.
#
# Note the mix of evidence types. This is a record that has been ingested
# once and enriched twice: the Northwind role has context and a reflection,
# the Fernhill role is still thin and is flagged in meta.enrichment_gaps.

person:
  name: "Jordan Rivera"
  headline: "Backend engineer focused on reliable, event-driven systems"
  location: "Austin, TX"
  email: "jordan.rivera@example.com"
  phone: "+1 555 010 2020"
  links:
    - label: "LinkedIn"
      url: "https://linkedin.com/in/jordanrivera-example"
    - label: "GitHub"
      url: "https://github.com/jordanrivera-example"
  summary: >
    Backend engineer with 6 years building and operating distributed
    systems in production. Known for taking on messy legacy pipelines and
    making them boring: reliable, observable, and cheap to run.

experiences:
  - id: exp-northwind-2021
    company: "Northwind Logistics"
    title: "Senior Backend Engineer"
    location: "Remote"
    start: "2021-03"
    end: "present"
    tags: [python, distributed-systems, leadership, kafka]

    achievements:
      - text: "Led migration of the billing reconciliation pipeline to an event-driven architecture, cutting reconciliation errors 40% and processing time from 6 hours to 20 minutes."
        tags: [python, distributed-systems, kafka]
        metric: "40% error reduction, 18x faster"
        evidence_type: documented
        source: "01_intake/output/processed/perf-review-2023-H2.pdf"
      - text: "Mentored 3 junior engineers; two were promoted to mid-level within a year."
        tags: [leadership, mentorship]
        evidence_type: documented
        source: "01_intake/output/processed/perf-review-2023-H2.pdf"
      - text: "Rewrote the on-call runbook and cut repeat pages for the same three failure modes to near zero."
        tags: [operations, documentation]
        evidence_type: self-reported
        source: "user-ramble 2026-08-15"

    context:
      team_size: 4
      scope: "Owned the billing pipeline end to end for roughly 8 months, including the finance-side rollout."
      initiative: unprompted
      evidence_type: self-reported
      source: "user-ramble 2026-08-15"

    reflections:
      - path: "self/reflections/northwind-billing-migration.md"
        captured: "2026-08-15"
        summary: "What the migration actually involved, why nobody else wanted it, and what the hard part turned out to be."

  - id: exp-fernhill-2018
